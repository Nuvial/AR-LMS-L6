<link href="{{ url_for('static', filename='css/env_tag.css') }}" rel="stylesheet">

<div class="top-stack">
    <div class="tag-row">
        {% if not current_user.id %}
        <div class="return" style="display: none;">
            <button type="button" class="btn btn-primary py-0" onclick="history.back()">
                <i class="fas fa-arrow-left fa-sm"></i> Back
            </button>
        </div>
        {% endif %}
        <div class="env-tag" data-env="{{ env }}" data-host="{{ env_host }}">
            <div class="left"></div>
            <div class="host">
                <div class="dot"></div>
                <span>
                    {% if env_host == 'secondary' %}
                    Backup Host - {{ env.capitalize() }}
                    {% else %}
                    {{ env_host.capitalize() }} Host - {{ env.capitalize() }}
                    {% endif %}
                </span>
            </div>
            <div class="info-icon-container">
                <div class="info-icon"
                    data-bs-toggle="tooltip" 
                    data-bs-html="true"
                    data-bs-title=
                        "
                        <strong>The application is running on the backup host (Render.com)</strong>
                        <br><br>
                        The primary server appears to be down or unreachable, so the app has failed-over to its secondary host.<br>
                        <strong>Database persistence is limited</strong> recent changes may not be saved between host session restarts.<br>
                        Learn more at <a href='https://render.com/docs/free#local-files-lost-on-redeploy' target='_blank' rel='noopener'>render.com</a>.
                        <br><br>
                        <em>Click the icon, or <a href='{{url_for('about.aboutPage')}}#sec-backup'>here</a>, for more info.</em>
                        "
                    data-href="{{ url_for('about.aboutPage') }}"
                    onclick="redirect(this)"
                    >
                    <i class="fas fa-triangle-exclamation fa-sm"></i>
                    Warning
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        initToolTips($('.info-icon'));
    });
</script>
