<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <title>AR LMS | {% block title %}{% endblock %}</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/fa4c14ad6c.js" crossorigin="anonymous"></script>
    <!-- Custom stylesheet for auth page -->
    <link href="{{ url_for ('static', filename='css/auth.css')}}" rel="stylesheet">

    <!-- Bootstrap Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <!-- Jquery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Helpers -->
    <script src="{{url_for('static', filename='js/helpers.js')}}"></script>
</head>
<body class="shell">
    {% if current_user.id %}
        {% include 'partials/sidebar-nav.html' %}
    {% endif %}

    <main class="flex-grow-1 d-flex justify-content-center align-items-center">
        {% include 'partials/env-tag.html' %}
        {% include 'partials/alert.html' %}

        {% block content %}{% endblock %}
    </main>
</body>
<script>
    // Parse any cached message flashes
    const flash = localStorage.getItem('flashMessage');
    if (flash){
        const { message, type } = JSON.parse(flash);
        flashMessage(message, type, 3000);;
        localStorage.removeItem('flashMessage');
    }
</script>
</html>
