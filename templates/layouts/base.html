<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    
    <!-- Base.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

    
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <title>AR LMS | {% block title %}{% endblock %}</title>
</head>
<body class="shell">
    <div class="loader-backdrop" id="spinnerLoader">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    {% include 'partials/sidebar-nav.html' %}

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/fa4c14ad6c.js" crossorigin="anonymous"></script>
    <!-- jQuery -->    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- Helpers -->
    <script src="{{ url_for('static', filename='js/helpers.js') }}"></script>

    <main class="container">
        <script>
            const current_user = {
                id: "{{ current_user.id }}",
                employee_id: "{{ current_user.employee_id }}",
                username: "{{ current_user.username }}",
                admin: "{{ '1' if current_user.admin else '0' }}",
                is_manager: "{{ '1' if current_user.is_manager else '0' }}"
            }
        </script>

        {% include "partials/env-tag.html" %}

        {% include "partials/alert.html" %}

        {% block content %}
        <!-- Content will be inserted here -->
        {% endblock %}
    </main>
</body>
<script>
    // Parse any cached message flashes
    const flash = localStorage.getItem('flashMessage');
    if (flash){
        const { message, type } = JSON.parse(flash);
        flashMessage(message, type, 3000);;
        localStorage.removeItem('flashMessage');
    }
</script>
</html>
