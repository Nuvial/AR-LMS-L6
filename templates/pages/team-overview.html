{% extends 'layouts/base.html' %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/team-overview.css') }}">

<div class="main-content-wrapper">
    <div class="card teams">
        <div class="card-header">
            {% if current_user.admin %}
                <button type="button" class="btn btn-primary btn-sm" id="createTeam">Create Team <i class="fas fa-plus"></i></button>
            {% endif %}
            <h5 class="card-title mb-0">Teams</h5>
        </div>
        <div class="card-body">
            <input class="form-control" id="team-search" placeholder="Search Team ID/Name/Manager ID...">
            <form id="newTeamForm" class="needs-validation" novalidate>
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <td class="team-id">Team ID</td>
                            <td class="team-name">Team Name</td>
                            <td class="manager-id">Manager ID</td>
                            <td class="manager-name">Manager Name</td>
                            <td class="employees-count">Employees</td>
                            <td class="actions">Actions</td>
                        </tr>
                    </thead>
                    <tbody id="teamTableBody">
                        <!-- Dynamically Generated -->
                    </tbody>
                </table>
            </form>
        </div>
    </div>
</div>
{% endblock %}
