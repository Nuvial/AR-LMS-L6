{% extends 'layouts/base.html' %}
{% block title %} Team Management {% endblock %}
{% block content %}
<!-- Jquery Selectpicker -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css">

<link rel="stylesheet" href="{{ url_for('static', filename='css/team-overview.css') }}">

<div class="main-content-wrapper">
    <div class="card teams">
        <div class="card-header">
            {% if current_user.admin %}
                <button type="button" class="btn btn-primary btn-sm" id="createTeam" onclick="createTeam()">Create Team <i class="fas fa-plus"></i></button>
            {% endif %}
            <h5 class="card-title mb-0">Teams</h5>
        </div>
        <div class="card-body">
            <div class="sticky-search">
                <input class="form-control" id="team-search" placeholder="Search Team ID/Name/Manager ID...">
            </div>
            <form id="newTeamForm" class="needs-validation" novalidate>
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th class="team-id">Team ID</th>
                            <th class="team-name">Team Name</th>
                            <th class="manager-id">Manager ID</th>
                            <th class="manager-name">Manager Name</th>
                            <th class="employees-count">Employees</th>
                            <th class="actions">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="teamTableBody">
                        <!-- Dynamically Generated -->
                    </tbody>
                </table>
            </form>
        </div>
    </div>
</div>
<!-- Popper.js for Selectpicker -->
 <script src="https://unpkg.com/@popperjs/core@2"></script>
<!-- JQuery selectpicker JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/js/bootstrap-select.min.js"></script>

<script src="{{ url_for('static', filename='js/teams/teams.js') }}"></script>
<script>
    let teams;

    $(document).ready(() => {
        teams = new Teams();
        if (teams.teams.length == 0) {
            $('#teamTableBody').append(teams.drawEmptyRow());
        }
    });

    async function createTeam() {
        const freeEmployees = await teams.getFreeEmployees(); 
        const newTeam = new Team();
        const $body = $('#teamTableBody');

        const newRowHtml = newTeam.drawNewTeamRow(freeEmployees);

        // Check if there are no teams currently
        const $noTeam = $('.no-teams');
        if ($noTeam.length > 0) {
            $body.empty().append(newRowHtml);
        } else { // Draw html as the first row
            $body.find('tr').first().before(newRowHtml)
        }

        // Initialise seletpicker element
        $($body).find('.selectpicker').selectpicker({
            countSelectedText: function(selected, total) {
                return selected + ' Employees';
            }
        });
    }
</script>
{% endblock %}
